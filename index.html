<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEVEL'UP - Formation & Accompagnement</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --kaki:#566020;
  --blanc:#f8f8f0;
  --gris:#f2f2f2;
}

body{
  margin:0;
  font-family:'Montserrat',sans-serif;
  background:var(--blanc);
  color:var(--kaki);
}

header{
  background:var(--kaki);
  color:var(--blanc);
  text-align:center;
  padding:20px;
}

header img{
  height:80px;
  border-radius:50%;
  margin-bottom:10px;
}

nav a{
  color:var(--blanc);
  margin:0 12px;
  text-decoration:none;
  font-weight:600;
}

nav a:hover{
  text-decoration: underline;
  color:#f2f2f2;
}

section{
  padding:50px 20px;
}

h2{
  text-align:center;
  margin-bottom:30px;
}

.services{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
}

.card{
  background:var(--blanc);
  border:2px solid var(--kaki);
  border-radius:15px;
  padding:20px;
  width:300px;
  text-align:center;
  box-shadow:0 4px 6px rgba(0,0,0,0.1);
  position:relative;
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:10px;
}

.tooltip{
  display:none;
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  background:var(--blanc);
  border:2px solid var(--kaki);
  border-radius:10px;
  padding:15px;
  font-size:0.85em;
  z-index:10;
}

.card:hover .tooltip{
  display:block;
}

.fullwidth-table {
  width: 100vw;
  margin: 0;
  overflow-x: auto;
}

table{
  width: 100%;
  border-collapse: collapse;
  font-size: 1em;
}

th, td{
  border: 1px solid var(--kaki);
  padding: 12px;
  text-align: center;
}

th{
  background: var(--kaki);
  color: var(--blanc);
  font-size: 1.05em;
}
